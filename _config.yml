# Site settings
title: Lee Blog
SEOTitle: 黄玄的博客 | Lee Blog
header-img: img/home-bg.jpg
# email: 填你自己的邮箱  # 原 huxpro@gmail.com 属原作者，leepro@gmail.com 属他人，均不可直接使用
description: "这里是 @Lee黄玄 的个人博客，与你一起发现更大的世界 | 要做一个有 swag 的程序员"
keyword: "黄玄, Lee黄玄, Lee, 鬼栈, leepro, @leepro, 黄玄的博客, Lee Blog, 博客, 个人网站, 互联网, Web, JavaScript, React, React Native, 前端, 设计"
url: "https://wlee93-github-io.pages.dev" # your host, for absolute URL
baseurl: "" # for example, '/blog' if your blog hosted on 'host/blog'


# Publish posts or collection documents with a future date.
future: true


# SNS settings
RSS: false
weibo_username: leepro
zhihu_username: leepro
github_username: leepro
twitter_username: leepro
#facebook_username:  leepro
#linkedin_username:  firstname-lastname-idxxxx


# Build settings
# from 2016, 'pygments' is unsupported on GitHub Pages. Use 'rouge' for highlighting instead.
highlighter: rouge
permalink: pretty
paginate: 10
exclude:
  [
    "less",
    "node_modules",
    "Gruntfile.js",
    "package.json",
    "README.md",
    "README.zh.md",
  ]
anchorjs: true # if you want to customize anchor. check out line:181 of `post.html`
# If you have timezone issue (e.g. #68) in China, uncomment to use this:
#timezone: CN


# Gems
# from PR#40, to support local preview for Jekyll 3.0
# make sure you have this gem installed
# `$ gem install jekyll-paginate`
plugins: [jekyll-paginate]


# Markdown settings
# replace redcarpet to kramdown,
# although redcarpet can auto highlight code, the lack of header-id make the catalog impossible, so I switch to kramdown
# document: http://jekyllrb.com/docs/configuration/#kramdown
markdown: kramdown
kramdown:
  input: GFM # use Github Flavored Markdown !important
  syntax_highlighter_opts:
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1


# Disqus settings
disqus_username: leepro


# Netease settings
netease_comment: false


# Analytics settings
# Baidu Analytics
# ba_track_id: [your track id]


# Google Analytics
# 已停用原作者的 UA-49627206-1：该 ID 属于原作者的统计资源，本站在为他人贡献访问数据。
# 留空或注释掉 ga_track_id 后，_includes/footer.html 中的统计脚本整段不会渲染。
# 注意：footer.html 使用的是旧版 analytics.js（Universal Analytics），
# UA 资源已于 2023 年 7 月停止收集数据，且不兼容 GA4 的 G-XXXXXXXXXX 格式。
# 如需统计，请改用 gtag.js，并把你在 GA4 后台创建的测量 ID 填到下面的位置。
# ga_track_id: "G-XXXXXXXXXX"
ga_domain: wlee93-github-io.pages.dev


# Sidebar settings
sidebar: true # whether or not using Sidebar.
sidebar-about-description: "要做一个有 swag 的程序员 <br> React Team @ Meta"
sidebar-avatar: https://github.com/Leepro.png # use absolute URL, seeing it's used in both `/` and `/about/`
